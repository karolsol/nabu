[versions]
spring-boot = "4.1.1"
spring-dependency-management = "1.1.7"
liquibase-plugin = "3.1.0"
freefair-lombok = "9.8.2"

liquibase = "5.0.4"
mapstruct = "1.6.3"
lombok-mapstruct-binding = "0.2.0"
springdoc = "3.2.0"
modulith = "2.1.1"
picocli = "4.7.6"

[libraries]
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "modulith" }

springdoc-openapi-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
lombok-mapstruct-binding = { module = "org.projectlombok:lombok-mapstruct-binding", version.ref = "lombok-mapstruct-binding" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
liquibase-hibernate = { module = "org.liquibase.ext:liquibase-hibernate7", version.ref = "liquibase" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
liquibase = { id = "org.liquibase.gradle", version.ref = "liquibase-plugin" }
freefair-lombok = { id = "io.freefair.lombok", version.ref = "freefair-lombok" }