name: Gradle CI (Spotless & Tests)

on:
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read
  pull-requests: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for changes in src/
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'src/**'

      - name: Set up JDK 25
        if: steps.filter.outputs.src == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Run Spotless and Test
        if: steps.filter.outputs.src == 'true'
        run: gradle spotlessCheck test
