spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://prod-db-host:5432/nabu}
    username: ${SPRING_DATASOURCE_USERNAME:prod_user}
    password: ${SPRING_DATASOURCE_PASSWORD:secret_prod_password}

  jpa:
    show-sql: false

  web:
    error:
      include-stacktrace: never
      include-message: never
      include-binding-errors: never