spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://prod-db-host:5432/nabu}
    username: ${SPRING_DATASOURCE_USERNAME:prod_user}
    password: ${SPRING_DATASOURCE_PASSWORD:secret_prod_password}

  jpa:
    show-sql: false

  web:
    error:
      include-stacktrace: never
      include-message: never
      include-binding-errors: never

jwt:
  secret: # Add your production secret key here, ensure it is at least 43 characters long
  access-ttl: PT10M
  refresh-ttl: P14D
  secure-cookie: true # Set this to true if behind HTTPS reverse proxy, false if not