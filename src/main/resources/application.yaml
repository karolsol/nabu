spring:
  application:
    name: nabu
  datasource:
    url: jdbc:postgresql://localhost:5432/nabu
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

server:
  forward-headers-strategy: native

jwt:
  secret: SUPEREXTREMESECRETKEYTHATISLONGERTHAN32CHARACTERSANDISUSEDFORTESTINGPURPOSESONLY
  access-ttl: PT10M
  refresh-ttl: P14D
  secure-cookie: true
